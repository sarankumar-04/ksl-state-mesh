# ─────────────────────────────────────────────────────────────────────────────
# KSL SANDBOX PROFILE — Zero external dependencies
# Run: mvn spring-boot:run -Dspring-boot.run.profiles=sandbox
#
# What this does:
#   ✅ H2 in-memory database (no PostgreSQL needed)
#   ✅ Flyway auto-migrates schema + sample data on startup
#   ✅ Swagger UI open at http://localhost:8080/swagger-ui.html
#   ✅ H2 Console open at http://localhost:8080/h2-console
#   ✅ All APIs open — NO login, NO password
#   ✅ CORS open — HTML dashboard works from file://
#   ✅ Kafka completely OFF — no spam logs, no connection errors
# ─────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: jdbc:h2:mem:ksldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ksl
    password: ksl

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Security disabled — NO username/password prompt
  security:
    user:
      name: ksl-admin
      password: ksl-sandbox-2024

  # NOTE: spring.kafka.bootstrap-servers is intentionally ABSENT here.
  # KafkaConfig uses @ConditionalOnProperty(name="spring.kafka.bootstrap-servers")
  # so when this property is missing, Kafka is completely skipped.

ksl:
  conflict:
    window-seconds: 30
  polling:
    high-frequency-ms: 120000
    normal-frequency-ms: 900000
    slow-frequency-ms: 7200000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 15s
    instances:
      shops-est:
        base-config: default
      factories:
        base-config: default
      pollution-ctrl:
        base-config: default
      sws:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

logging:
  level:
    root: WARN
    com.karnataka.ksl: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    # Silence all Kafka logs completely
    org.apache.kafka: OFF
    org.springframework.kafka: OFF
    kafka: OFF
